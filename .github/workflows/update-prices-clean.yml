name: Update electricity prices clean

on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and normalize electricity prices
        shell: bash
        run: |
          set -euo pipefail

          YESTERDAY=$(TZ=Europe/Tallinn date -d "yesterday" +%F)
          DAY_AFTER_TOMORROW=$(TZ=Europe/Tallinn date -d "+2 days" +%F)

          mkdir -p data

          URL="https://nordapi.ee/api/v1/elering/prices?start=${YESTERDAY}&end=${DAY_AFTER_TOMORROW}"

          curl --fail --location --retry 3 \
            --connect-timeout 20 \
            --max-time 90 \
            -H "Accept: application/json" \
            -H "User-Agent: EnergiaEE-GitHubActions/4.0" \
            "$URL" \
            -o data/raw-prices.json

          python3 - <<'PYCODE'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tallinn = ZoneInfo("Europe/Tallinn")
          today = datetime.now(tallinn).date()
          tomorrow = today + timedelta(days=1)

          raw = json.loads(
              Path("data/raw-prices.json").read_text(
                  encoding="utf-8"
              )
          )

          node = raw

          for _ in range(5):
              if (
                  isinstance(node, dict)
                  and "ee" in node
                  and isinstance(node["ee"], list)
              ):
                  source_rows = node["ee"]
                  break

              if isinstance(node, dict) and "data" in node:
                  node = node["data"]
              else:
                  source_rows = []
                  break
          else:
              source_rows = []

          unique_rows = {}

          for row in source_rows:
              timestamp = int(row["timestamp"])
              unique_rows[timestamp] = {
                  "timestamp": timestamp,
                  "price": float(row["price"])
              }

          today_prices = []
          tomorrow_prices = []

          for row in sorted(
              unique_rows.values(),
              key=lambda item: item["timestamp"]
          ):
              local_datetime = datetime.fromtimestamp(
                  row["timestamp"],
                  timezone.utc
              ).astimezone(tallinn)

              delivery_date = local_datetime.date()
              row["delivery_date"] = delivery_date.isoformat()

              if delivery_date == today:
                  today_prices.append(row)
              elif delivery_date == tomorrow:
                  tomorrow_prices.append(row)

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "today": today.isoformat(),
              "tomorrow": tomorrow.isoformat(),
              "today_prices": today_prices,
              "tomorrow_prices": tomorrow_prices,
              "today_count": len(today_prices),
              "tomorrow_count": len(tomorrow_prices)
          }

          print(
              f"Today: {len(today_prices)} points"
          )
          print(
              f"Tomorrow: {len(tomorrow_prices)} points"
          )

          if len(today_prices) < 92:
              raise RuntimeError(
                  f"Today contains only "
                  f"{len(today_prices)} points"
              )

          Path("data/prices.json").write_text(
              json.dumps(
                  output,
                  ensure_ascii=False
              ),
              encoding="utf-8"
          )

          Path("data/raw-prices.json").unlink()
          PYCODE

      - name: Commit electricity prices
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "Electricity price data did not change"
            exit 0
          fi

          git commit -m "Update normalized electricity prices"
          git push
