name: Update electricity prices clean

on:
schedule:
- cron: "15 12 * * *"
- cron: "15 13 * * *"
- cron: "15 14 * * *"
workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: electricity-price-update
  cancel-in-progress: true

jobs:
  update-prices:
    name: Fetch and publish electricity prices
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and normalize prices
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYCODE'
          import json
          import time
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TALLINN = ZoneInfo("Europe/Tallinn")
          API = "https://nordapi.ee/api/v1/elering/prices"

          today = datetime.now(TALLINN).date()
          tomorrow = today + timedelta(days=1)

          # Request overlapping one-day ranges. This avoids any ambiguity
          # in the API's inclusive/exclusive end-date handling.
          query_days = [
              today - timedelta(days=1),
              today,
              tomorrow,
          ]

          all_prices = {}

          def find_ee_prices(payload):
              node = payload
              for _ in range(6):
                  if isinstance(node, dict):
                      ee = node.get("ee")
                      if isinstance(ee, list):
                          return ee
                      if "data" in node:
                          node = node["data"]
                          continue
                  break
              return []

          for start_date in query_days:
              end_date = start_date + timedelta(days=1)
              url = (
                  f"{API}?start={start_date.isoformat()}"
                  f"&end={end_date.isoformat()}"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "EnergiaEE-GitHubActions/4.0",
                  },
              )

              last_error = None
              payload = None

              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                      break
                  except Exception as error:
                      last_error = error
                      print(
                          f"Attempt {attempt}/3 failed for {start_date}: {error}"
                      )
                      time.sleep(5)

              if payload is None:
                  raise RuntimeError(
                      f"Could not download prices for {start_date}: {last_error}"
                  )

              rows = find_ee_prices(payload)
              print(
                  f"Downloaded {len(rows)} EE rows for "
                  f"{start_date} to {end_date}"
              )

              for row in rows:
                  timestamp = int(row["timestamp"])
                  price = float(row["price"])
                  all_prices[timestamp] = {
                      "timestamp": timestamp,
                      "price": price,
                  }

          today_prices = []
          tomorrow_prices = []

          for item in sorted(
              all_prices.values(), key=lambda value: value["timestamp"]
          ):
              local_datetime = datetime.fromtimestamp(
                  item["timestamp"], timezone.utc
              ).astimezone(TALLINN)

              normalized = {
                  "timestamp": item["timestamp"],
                  "price": item["price"],
                  "delivery_date": local_datetime.date().isoformat(),
                  "local_time": local_datetime.isoformat(),
              }

              if local_datetime.date() == today:
                  today_prices.append(normalized)
              elif local_datetime.date() == tomorrow:
                  tomorrow_prices.append(normalized)

          output = {
              "success": True,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "timezone": "Europe/Tallinn",
              "today": today.isoformat(),
              "tomorrow": tomorrow.isoformat(),
              "today_count": len(today_prices),
              "tomorrow_count": len(tomorrow_prices),
              "today_prices": today_prices,
              "tomorrow_prices": tomorrow_prices,
          }

          # A normal 15-minute delivery day has 96 points. DST transition
          # days may have 92 or 100, so accept every complete day from 92 up.
          if len(today_prices) < 92:
              raise RuntimeError(
                  f"Today's data is incomplete: {len(today_prices)} points"
              )

          # Tomorrow can legitimately be empty before day-ahead prices are
          # published. Keep today's valid data instead of failing the job.
          if len(tomorrow_prices) < 92:
              print(
                  "Warning: tomorrow is not complete yet: "
                  f"{len(tomorrow_prices)} points"
              )

          destination = Path("data/prices.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(
              f"Saved {len(today_prices)} points for today and "
              f"{len(tomorrow_prices)} points for tomorrow"
          )
          PYCODE

      - name: Validate generated JSON
        shell: bash
        run: |
          set -euo pipefail
          test -s data/prices.json
          python3 -m json.tool data/prices.json > /dev/null
          echo "Generated file size:"
          wc -c data/prices.json
          echo "Generated counts:"
          python3 - <<'PYCODE'
          import json
          from pathlib import Path

          data = json.loads(Path("data/prices.json").read_text(encoding="utf-8"))
          print("today_count:", data.get("today_count"))
          print("tomorrow_count:", data.get("tomorrow_count"))
          print("updated_at:", data.get("updated_at"))
          PYCODE

      - name: Commit updated prices
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.json

          if git diff --cached --quiet; then
            echo "No changes in data/prices.json"
            exit 0
          fi

          git commit -m "Update normalized electricity prices"
          git push
